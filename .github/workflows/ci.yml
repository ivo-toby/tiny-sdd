name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - '22.19.0'
          - '24'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Check script syntax
        run: |
          node --check scripts/release-plan.mjs
          node --check scripts/release.mjs
          node --check scripts/verify-package.mjs

      - name: Run offline test suite
        run: npm test
        env:
          TYPESAFE_API_KEY: stub
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''

      - name: Check package release plan
        run: node scripts/release-plan.mjs --dry-run --json
        env:
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''

      - name: Pack and verify the installed package
        env:
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''
        run: node scripts/verify-package.mjs --project . --version "$(node -p 'require("./package.json").version')" --json
